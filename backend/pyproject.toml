[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "schema-media"
version = "0.1.0"
description = "Schema: web-native media organizer and renamer (FileBot replacement)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "httpx>=0.27",
  "watchdog>=4.0",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "Unidecode>=1.3",
  "regex>=2024.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "Pillow>=10.4",
  "ruff>=0.5",
]

[project.scripts]
schema = "schema_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["schema_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
