# Builds the Schema image on every push to main, smoke-tests it, then pushes it to GHCR.
# A Watchtower instance can poll ghcr.io/cwramey/schema-media:latest and redeploy on a new digest.

name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cwramey/schema-media

jobs:
  publish:
    name: Build, smoke test, push
    runs-on: ubuntu-latest
    timeout-minutes: 30   # hard cap so a hung build or smoke test can't burn hours of Actions minutes
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: schema-media:test
          build-args: SCHEMA_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name schema -p 8420:8420 -e SCHEMA_DEMO=1 -e PUID=1000 -e PGID=1000 schema-media:test
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8420/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8420/api/health
          # /api/health only shows the commit to a signed-in browser: ask the app inside the container.
          commit="$(docker exec schema python -c 'from schema_app import build_commit; print(build_commit())')"
          echo "build commit: ${commit}"
          test "${commit}" = "${GITHUB_SHA}"
          docker exec schema python /usr/local/bin/schema-healthcheck

      - name: Container logs
        if: failure()
        run: docker logs schema || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: SCHEMA_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
